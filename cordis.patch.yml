- insert:
    - id: qise-code-review
      name: '@jkin8010/dsh-code-review'
      config:
        # 默认工作区：自动发现其下有 .git 的直接子目录
        projectRoots:
          - /Users/jkin/workspace
        # 向下扫描 2 层，覆盖 <workspace>/<org>/<repo> 布局
        projectDepth: 2
        maxProjects: 40
        # 额外纳入的项目（可非 Git）：当前项目/插件工作区
        extraProjects:
          - /Users/jkin/workspace/jkin8010/dhs-feishu-plugin
        # 空 = 最近提交的已发现项目；也可填某个项目绝对路径作为固定默认
        defaultProjectPath: ''
        engine: auto
        pollSeconds: 2
        # OCR 引擎（非必填；也可用环境变量 OCR_LLM_URL / OCR_LLM_TOKEN / OCR_LLM_MODEL 或 ~/.opencodereview/config.json）
        ocr:
          command: ''
          provider: ''
          model: ''
          effort: medium
          concurrency: 8
          timeoutMin: 15
